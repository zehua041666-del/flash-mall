server:
  port: 8080

spring:
  application:
    name: flash-mall-app
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/flash_mall?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root123
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  data:
    redis:
      host: localhost
      port: 6379
      password: redis123
      database: 0

jwt:
  # HS256 要求密钥至少 256 位（32 字节），这里用 64 字符长字符串
  secret: flash-mall-jwt-secret-key-please-change-in-production-0123456789
  # token 有效期（毫秒），这里 7 天
  expiration: 604800000
  
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0